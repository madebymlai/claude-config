[package]
name = "explore-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Search a repository's code and read it by definition: the exploring-code skill's explore, in Rust"
license = "MIT"
publish = false

[[bin]]
name = "explore-rust"
path = "src/main.rs"

[dependencies]
# the crates ripgrep 15.2 searches with, so that hits follows rg's matching, walking and ignore rules
grep-cli = "0.1.12"
grep-matcher = "0.1.9"
grep-pcre2 = "0.1.10"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
ignore = "0.4.34"
encoding_rs = "0.8.35"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# tree-sitter and the grammar versions ast-grep 0.51.3 locks, so the node kinds are the ones its parse produced
tree-sitter = "=0.27.2"
tree-sitter-bash = "=0.25.1"
tree-sitter-c = "=0.24.2"
tree-sitter-cpp = "=0.23.4"
tree-sitter-c-sharp = "=0.23.5"
tree-sitter-go = "=0.25.0"
tree-sitter-java = "=0.23.5"
tree-sitter-javascript = "=0.25.0"
tree-sitter-kotlin-sg = "=0.4.1"
tree-sitter-lua = "=0.5.0"
tree-sitter-php = "=0.25.1"
tree-sitter-python = "=0.25.0"
tree-sitter-ruby = "=0.23.1"
tree-sitter-rust = "=0.24.2"
tree-sitter-scala = "=0.26.13"
tree-sitter-swift = "=0.7.4"
tree-sitter-typescript = "=0.23.2"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
